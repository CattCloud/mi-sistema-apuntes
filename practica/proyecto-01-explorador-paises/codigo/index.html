<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <header class="my-4">
        <h1 class="text-center font-bold text-3xl">Explorador de Paises</h1>
    </header>


    <main class="mx-8">
        <section id="controls-section" class="my-4 flex justify-between gap-4">
            <input type="text" class="border rounded-xl px-3 py-1 flex-1" placeholder="Buscar pais..."
                aria-label="Input de Busqueda" required>
            <select class="px-3 py-1 border rounded-xl " aria-label="Control para seleccionar region" required>
                <option value="">Selecciona una region</option>
                <option value="africa">Africa</option>
                <option value="asia">Asia</option>
                <option value="americas">America</option>
                <option value="europe">Europa</option>
                <option value="oceania">Oceania</option>
            </select>
        </section>
        <section id="rejilla-paises" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <article class="border shadow-sm px-3 py-6 rounded-xl hover:shadow-md">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSl6s372yUQXCftW-OmmL7R74a6B_mKefIyrAiYcSx1MQ&s=10"
                    alt="Bandera de Peru">
                <h3 class="font-bold text-xl text-center">Peru</h3>
                <section class="text-gray-500">
                    <p class="flex justify-between">
                        <span class="font-bold">Poblacion</span>
                        <span>5000</span>
                    </p>
                    <p class="flex justify-between">
                        <span class="font-bold">Region</span>
                        <span>America</span>
                    </p>
                    <p class="flex justify-between">
                        <span class="font-bold">Capital</span>
                        <span>Lima</span>
                    </p>
                </section>

            </article>

        </section>
    </main>
</body>

</html>
